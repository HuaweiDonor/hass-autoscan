services:
  autoscan-worker-debug:
    build:
      context: .
      dockerfile: Dockerfile
    image: autoscan-worker:latest
    container_name: autoscan-worker-debug
    # Modern GPU reservation (Docker Compose v2.3+ / Engine 19.03+ with
    # nvidia-container-toolkit installed). If your setup is older and this
    # isn't picked up, replace it with the top-level key `runtime: nvidia`
    # instead.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      # Pre-download models elsewhere and copy them here if models.vsp.net.ua
      # isn't reachable from this machine (see README) -- avoids needing
      # network access to it at all.
      - ./models:/app/models
    command:
      - python3.11
      - -m
      - app.main
      - --config
      - /app/config/config.yaml
      - --debug
      - --snapshots
      - /app/data/snapshots
