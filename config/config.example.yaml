# Copy this file to config.yaml and fill in your own values.
# config.yaml is gitignored so secrets don't get committed.
#
# For a local test of just the camera + plate recognition (no HA/whitelist
# needed yet), run with --debug: only rtsp_url below is required for that.
#   python -m app.main --config config/config.yaml --debug

rtsp_url: rtsp://user:password@192.168.1.50:554/stream1

ha_url: http://homeassistant.local:8123
ha_token: REPLACE_WITH_LONG_LIVED_ACCESS_TOKEN
ha_domain: switch
ha_service: turn_on
ha_entity_id: switch.gate_relay

allowed_plates:
  - A123BC777
  - K777XA777

cooldown_seconds: 60
confidence_threshold: 0.85
sample_fps: 3

# Keep true until you've verified detections/matches look correct in
# data/events.sqlite3 and data/snapshots/ against your real camera.
dry_run: true
