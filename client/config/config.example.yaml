# Copy this file to config.yaml and fill in your own values.
# config.yaml is gitignored so secrets don't get committed.
#
# This service needs a reachable MQTT broker (the same one your worker
# publishes to) with a matching mqtt_topic, plus your Home Assistant
# details. It has no GPU/camera dependency at all — meant to run on/near
# your Home Assistant host.

# Use credentials that are only allowed to SUBSCRIBE to mqtt_topic and
# PUBLISH under autoscan/<mqtt_client_id>/# and homeassistant/# (see broker
# ACL note in README) — the latter is needed for the HA Discovery entities
# below (last plate/time/snapshot), not for detections themselves.
mqtt_broker_host: mqtt.local
mqtt_broker_port: 1883
mqtt_username: autoscan-client
mqtt_password: REPLACE_WITH_CLIENT_MQTT_PASSWORD
mqtt_topic: autoscan/plates/detections
mqtt_client_id: autoscan-client

ha_url: http://homeassistant.local:8123
ha_token: REPLACE_WITH_LONG_LIVED_ACCESS_TOKEN
ha_domain: switch
ha_service: turn_on
ha_entity_id: switch.gate_relay

allowed_plates:
  - A123BC777
  - K777XA777

cooldown_seconds: 60
confidence_threshold: 0.85

# Keep true until you've verified detections/matches look correct in
# data/events.sqlite3 and data/snapshots/ against your real camera.
dry_run: true

# When true (default), publishes every detection (time, plate, snapshot)
# as Home Assistant MQTT Discovery entities (2 sensors + 1 camera) under
# the "Autoscan Client" device, so the last scan is visible in the HA UI
# without needing to read data/events.sqlite3 directly.
ha_discovery_enabled: true
ha_discovery_prefix: homeassistant
